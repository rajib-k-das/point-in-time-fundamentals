version: 2

models:
  - name: int_facts__mapped
    description: >
      SEC facts mapped to standard metrics with one tag chosen per metric, period, and filing.
      Grain = one filing's value for one metric and period.
    columns:
      - name: metric_fact_id
        data_tests: [unique, not_null]
      - name: metric
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('concept_map')
                field: metric
      - name: period_grain
        data_tests:
          - accepted_values:
              arguments:
                values: ['instant', 'quarter', 'annual', 'trailing_twelve_months', 'year_to_date']

  - name: int_fact_versions
    description: >
      SCD Type 2 history of every reported fact (one metric, company and period). One row per
      meaningfully different value, valid from the day after it was first filed until the day
      after it was superseded. Point-in-time lookup:
      `valid_from <= as_of_date and (valid_to is null or as_of_date < valid_to)`.
    columns:
      - name: version_id
        description: Surrogate key (fact_key + version_number).
        data_tests: [unique, not_null]
      - name: fact_key
        description: One metric for one company and one period.
        data_tests: [not_null]
      - name: version_number
        description: 1 for the first published value, then +1 for each meaningful change.
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
      - name: valid_from
        description: First date the value was public (filed date + 1 day). Inclusive.
        data_tests: [not_null]
      - name: valid_to
        description: Date the value was superseded (the next version's valid_from). Exclusive; null if current.
      - name: is_current
        data_tests: [not_null]
      - name: is_restatement
        description: True when this value replaced an earlier, different published value.
        data_tests: [not_null]
      - name: is_tag_switch
        description: >
          True when this restatement was reported under a different, equivalent XBRL tag than the
          version it replaced (e.g. the 2018 move to the ASC 606 revenue tag).
        data_tests: [not_null]
      - name: is_scale_error
        description: >
          True when this superseded value differs from the current value by a power of 1,000,
          which indicates an XBRL scale-tagging error. Exclude these from analytics.
        data_tests: [not_null]
